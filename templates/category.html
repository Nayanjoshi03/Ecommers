{% extends "base.html" %}
{% block content %}
<h1 style="font-family: var(--font-heading); margin: 2.2em 1.2em 0.3em;">{{ title }} Collection</h1>
<div class="product-grid">
    {% for product in products %}
    <div class="product-card">
        <img src="{{ product.image_url if product.image_url else 'https://via.placeholder.com/400x500?text=' + product.name }}"
            alt="{{ product.name }}" class="product-img">
        <div class="product-info">
            <h3>{{ product.name }}</h3>
            <p class="price">${{ "%.2f" | format(product.price) }}</p>
            <a href="{{ url_for('product_detail', product_id=product.id) }}" class="btn">View Details</a>
        </div>
    </div>
    {% else %}
    <p>No products found in this category.</p>
    {% endfor %}
</div>
{% endblock %}
